[package]
name = "uuid7-rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "_core"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "=0.29.2"

[dependencies]
pyo3 = {
    version = "=0.29.2",
    features = ["nightly"],
}
rand = {
    version = "=0.10.2",
    default-features = false,
    features = [
        "std_rng",
        "sys_rng",
    ],
}
# mimalloc v3
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    features = [
        "override",
        "local_dynamic_tls",
    ],
}

[target.'cfg(target_os = "windows")'.dependencies]
windows-link = "=0.2.1"
mimalloc = {
    optional = true,
    version = "=0.1.52",
    features = [],
}

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    # See: https://github.com/lava-sh/toml-rs/issues/229
    #
    # mimalloc "override" feature installs process-wide malloc interposition and
    # replaces macOS malloc zone/fork hooks when the extension is imported via dlopen.
    # That breaks fork-based subprocess spawning, e.g., asyncio/playwright can fail.
    features = ["local_dynamic_tls"],
}

[features]
default = []
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1

[lints.rust]
warnings = "deny"

[lints.clippy]
perf       = { level = "deny", priority = 1 }
style      = { level = "deny", priority = -1 }
pedantic   = { level = "deny", priority = -1 }
nursery    = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

allow_attributes = "deny"
disallowed_types = "deny"

too_many_lines = "allow"
manual_let_else = "allow"
cast_possible_truncation = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
