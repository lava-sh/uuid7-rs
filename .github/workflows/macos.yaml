name: "macOS"

on:
  workflow_call:

env:
  __interpreters: &interpreters "3.11 3.12 3.13 3.14 3.15 pypy3.11"
  #
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: "${{ matrix.platform.runner }} / ${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # See: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        platform:
          - {
            # Intel Mac
            runner: macos-26-intel,
            target: x86_64-apple-darwin,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc",
          }
          - {
            # Apple Silicon M1-M4
            runner: xcode-27,
            target: aarch64-apple-darwin,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc",
          }
          - {
            # Universal binary (Intel + Apple Silicon)
            runner: xcode-27,
            target: universal2-apple-darwin,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc",
          }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: *is_pull_request
        with:
          version: "v2.0.0-rc.3"
          pr-comment: false
          github-cache: true
          cache-executables: true
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ matrix.platform.target }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: *is_pull_request

      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          container: off
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            ${{ matrix.platform.maturin-build-args || '' }}
            --compatibility pypi

      - name: "kache stats"
        if: *is_pull_request
        run: kache stats --full

      - name: "Upload wheels"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
