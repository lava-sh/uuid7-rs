name: "tests"

on:
  workflow_call:

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: "${{ matrix.os }} / python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          "3.15",
          "pypy3.11",
        ]
        os: [
          "ubuntu-26.04",
          "windows-2025",
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]
          shared-key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: "Create and activate .venv"
        shell: bash
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo ".venv/Scripts" >> "$GITHUB_PATH"
            echo "PYO3_PYTHON=.venv/Scripts/python" >> "$GITHUB_ENV"
            echo "UV_LINK_MODE=copy" >> "$GITHUB_ENV"
          else
            echo ".venv/bin" >> "$GITHUB_PATH"
            echo "PYO3_PYTHON=.venv/bin/python3" >> "$GITHUB_ENV"
          fi

      - name: "Install dependencies"
        run: uv pip install --group ci

      - name: "Run maturin"
        run: maturin build --out wheels --features mimalloc

      - name: "Install built wheel"
        run: uv pip install uuid7-rs --no-index --find-links wheels --force-reinstall

      - name: "Run ruff"
        run: ruff check

      - name: "Run ty"
        run: ty check

      - name: "Run pytest"
        run: pytest tests/
